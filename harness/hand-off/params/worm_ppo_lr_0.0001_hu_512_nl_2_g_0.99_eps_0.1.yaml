behaviors:
  Worm:
    hyperparameters:
      batch_size: 2024
      beta: 0.005
      buffer_size: 20240
      epsilon: 0.1
      lambd: 0.95
      learning_rate: 0.0001
      learning_rate_schedule: linear
      num_epoch: 3
    keep_checkpoints: 5
    max_steps: 7000000
    network_settings:
      hidden_units: 512
      normalize: true
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    summary_freq: 30000
    time_horizon: 1000
    trainer_type: ppo
